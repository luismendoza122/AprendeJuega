      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar el APK
        run: |
          cd AprendeJuega
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../AprendeJuega.apk

      - name: Guardar el codigo en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf AprendeJuega/.gradle AprendeJuega/build AprendeJuega/app/build
          git add AprendeJuega
          git commit -m "Codigo de Aprende y Juega 2.0" || echo "Sin cambios"
          git push || echo "No se pudo guardar el codigo"

      - name: Publicar el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Aprende y Juega 2.0 (${{ github.run_number }})
          files: AprendeJuega.apk
